[package]
name = "opendtu-display-esp32"
version = "0.1.0"
authors = ["ds2k5 <dennisschneck@web.de>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "opendtu-display-esp32"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
# ESP core
log                 = "0.4"
esp-idf-svc         = { version = "0.52", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
esp-idf-hal         = { version = "0.46" }
embassy-time        = { version = "0.5", features = ["generic-queue-8"] }

# Embedded traits
embedded-hal        = "1"
embedded-svc        = "0.29"

# Display
embedded-graphics   = "0.8"
mipidsi             = "0.8"
display-interface-spi = "0.5"

# Data
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
anyhow              = "1"

[build-dependencies]
embuild = "0.33"
